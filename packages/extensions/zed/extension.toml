id = "corz"
name = "Corz"
description = "The open source coding agent."
version = "1.14.48"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/anomalyco/corz"

[agent_servers.corz]
name = "Corz"
icon = "./icons/corz.svg"

[agent_servers.corz.targets.darwin-aarch64]
archive = "https://github.com/anomalyco/corz/releases/download/v1.14.48/corz-darwin-arm64.zip"
