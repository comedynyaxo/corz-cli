args = ["acp"]

[agent_servers.corz.targets.darwin-x86_64]
archive = "https://github.com/anomalyco/corz/releases/download/v1.14.48/corz-darwin-x64.zip"
cmd = "./corz"
args = ["acp"]

[agent_servers.corz.targets.linux-aarch64]
archive = "https://github.com/anomalyco/corz/releases/download/v1.14.48/corz-linux-arm64.tar.gz"
cmd = "./corz"
args = ["acp"]

[agent_servers.corz.targets.linux-x86_64]
archive = "https://github.com/anomalyco/corz/releases/download/v1.14.48/corz-linux-x64.tar.gz"
cmd = "./corz"
args = ["acp"]

[agent_servers.corz.targets.windows-x86_64]
archive = "https://github.com/anomalyco/corz/releases/download/v1.14.48/corz-windows-x64.zip"
